<script>
let famososGlobal = [];

function agregarLog(texto){

    const logs = document.getElementById("logs");

    const linea = document.createElement("p");

    const hora = new Date().toLocaleTimeString();

    linea.textContent = `[${hora}] ${texto}`;

    logs.appendChild(linea);

    logs.scrollTop = logs.scrollHeight;
}

function normalizarFecha(fecha){

    fecha = fecha.trim();

    fecha = fecha.replace(/\./g,"-");

    if(
        fecha.toLowerCase().includes("alrededor") ||
        fecha.toLowerCase().includes("a.c")
    ){

        return {
            fecha: "No confirmada",
            valida: false
        };
    }

    fecha = fecha.replace(/\//g,"-");

    let partes = fecha.split("-");

    if(partes.length !== 3){

        return {
            fecha: "No confirmada",
            valida: false
        };
    }

    let dia, mes, anio;

    if(partes[0].length === 4){

        anio = partes[0];
        mes = partes[1];
        dia = partes[2];

    }else{

        dia = partes[0];
        mes = partes[1];
        anio = partes[2];
    }

    dia = parseInt(dia);
    mes = parseInt(mes);

    if(
        isNaN(dia) ||
        isNaN(mes) ||
        dia < 1 ||
        dia > 31 ||
        mes < 1 ||
        mes > 12
    ){

        return {
            fecha: "No confirmada",
            valida: false
        };
    }

    dia = String(dia).padStart(2,"0");
    mes = String(mes).padStart(2,"0");

    return {
        fecha: `${dia}-${mes}-${anio}`,
        valida: true
    };
}

function normalizarComuna(texto, formato){

    texto = texto.trim();

    texto = texto.replace(/\s+/g, " ");

    if(formato === "mayusculas"){
        texto = texto.toUpperCase();
    }

    else if(formato === "minusculas"){
        texto = texto.toLowerCase();
    }

    else{

        texto = texto
            .toLowerCase()
            .split(" ")
            .map(palabra =>
                palabra.charAt(0).toUpperCase() +
                palabra.slice(1)
            )
            .join(" ");
    }

    return texto;
}

function calcularEdad(fecha){

    if(fecha === "No confirmada"){
        return "No se puede calcular";
    }

    let partes = fecha.split("-");

    let nacimiento = new Date(
        partes[2],
        partes[1]-1,
        partes[0]
    );

    let hoy = new Date();

    let edad =
        hoy.getFullYear() -
        nacimiento.getFullYear();

    let mes =
        hoy.getMonth() -
        nacimiento.getMonth();

    if(
        mes < 0 ||
        (
            mes === 0 &&
            hoy.getDate() < nacimiento.getDate()
        )
    ){
        edad--;
    }

    return edad;
}

function esCumpleaños(fecha){

    if(fecha === "No confirmada"){
        return "NO";
    }

    let partes = fecha.split("-");

    let hoy = new Date();

    return (
        parseInt(partes[0]) === hoy.getDate()
        &&
        parseInt(partes[1]) ===
        (hoy.getMonth()+1)
    ) ? "SI" : "NO";
}

async function buscarComunaEnAPI(nombreComuna){

    try{

        const url =
            "https://chileabierto.cl/api/v1/comunas?search=" +
            encodeURIComponent(nombreComuna);

        const respuesta = await fetch(url);

        if(!respuesta.ok){
            throw new Error("Error al conectar API");
        }

        return await respuesta.json();

    }catch(error){

        console.warn("API no disponible por CORS:", error);

        return null;
    }
}

async function cargarComunasOficiales(){

    const respuesta = await fetch("comunas_oficial.json");

    if(!respuesta.ok){
        throw new Error("No se pudo cargar comunas_oficial.json");
    }

    const datos = await respuesta.json();

    return datos.data;
}

function buscarComunaOficial(nombreComuna, comunasOficiales){

    const claveComuna = nombreComuna
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .toLowerCase();

    return comunasOficiales.find(item => {

        const claveOficial = item.name
            .normalize("NFD")
            .replace(/[\u0300-\u036f]/g, "")
            .toLowerCase();

        return claveOficial === claveComuna;
    });
}

function buscarSugerenciaComuna(nombreComuna, comunasOficiales){

    const claveComuna = nombreComuna
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .toLowerCase();

    return comunasOficiales.find(item => {

        if(!item.name) return false;

        const claveOficial = item.name
            .normalize("NFD")
            .replace(/[\u0300-\u036f]/g, "")
            .toLowerCase();

        return claveOficial.includes(claveComuna) ||
               claveComuna.includes(claveOficial);
    });
}

function procesarArchivo(){

    document.getElementById("logs").innerHTML = "";
    document.getElementById("resultado").innerHTML = "";

    agregarLog("Iniciando proceso ETL");

    const archivo = document.getElementById("fileInput").files[0];

    if(!archivo){
        alert("Selecciona un archivo");
        return;
    }

    agregarLog("Archivo cargado correctamente");

    const esFamosos = document.getElementById("famosos").checked;
    const esComunas = document.getElementById("comunas").checked;

    agregarLog("Modo: " + (
        esFamosos ? "Famosos" :
        esComunas ? "Comunas" :
        "Lugares"
    ));

    const lector = new FileReader();

    lector.onload = async function(e){

        try{
            agregarLog("Leyendo contenido del archivo");

            const contenido = e.target.result;
            const lineas = contenido.split(/\r?\n/);

            agregarLog(`${lineas.length} líneas encontradas`);

            let comunasOficiales = []
            if(esComunas){
                comunasOficiales = await cargarComunasOficiales();
            }

            let registros = new Set();
            let duplicados = 0;
            let ignorados = 0;

            let famosos = [];
            let comunas = [];
            let tablaLugares = [];
            let tablaGeo = [];
            let tablaDirecciones = [];

            let contadorID = 1;

            for(let i = 0; i < lineas.length; i++){

                let linea = lineas[i].trim();

                if(linea === ""){
                    ignorados++;
                    continue;
                }

                // Evita tomar encabezados como datos.
                const lineaMin = linea.toLowerCase();
                if(
                    lineaMin === "direccion" ||
                    lineaMin === "dirección" ||
                    lineaMin === "nombre" ||
                    lineaMin === "fecha" ||
                    lineaMin === "comuna"
                ){
                    ignorados++;
                    continue;
                }

                if(esComunas){

                    let formato = document.getElementById("formatoComuna").value;

                    let comuna = linea
                        .replace(/^\d+\.\s*/, "")
                        .trim();

                    comuna = normalizarComuna(comuna, formato);

                    const oficial = buscarComunaOficial(
                        comuna,
                        comunasOficiales
                    );

                    let nombreFinal = oficial ? oficial.name : comuna;

                    const clave = nombreFinal
                        .normalize("NFD")
                        .replace(/[\u0300-\u036f]/g,"")
                        .toLowerCase()
                        .replace(/\s+/g, " ")
                        .trim();

                    if(registros.has(clave)){
                        duplicados++;
                        continue;
                    }

                    registros.add(clave);
                    const sugerencia = !oficial
                        ? buscarSugerenciaComuna(comuna, comunasOficiales)
                        : null;

                    comunas.push({
                        id: comunas.length + 1,
                        nombre: nombreFinal,
                        region: oficial ? corregirTexto(oficial.region_name) : "No encontrada",
                        habitantes: oficial ? oficial.population : "No encontrado",
                        estado: oficial ? "Consolidada" : "No encontrada en fuente oficial"
                    });

                    continue;
                }

                if(esFamosos){

                    const match = linea.match(/^\d+\.\s*(.*?)\s*-\s*(.+)$/);

                    if(!match){
                        ignorados++;
                        continue;
                    }

                    let nombre = match[1].trim();
                    let fechaOriginal = match[2].trim();
                    let resultadoFecha = normalizarFecha(fechaOriginal);
                    let fecha = resultadoFecha.fecha;

                    let edad = resultadoFecha.valida
                        ? calcularEdad(fecha)
                        : "No se puede calcular";

                    let cumple = resultadoFecha.valida
                        ? esCumpleaños(fecha)
                        : "NO";

                    let clave = `${nombre.toLowerCase()}|${fecha}`;

                    if(registros.has(clave)){
                        duplicados++;
                        continue;
                    }

                    registros.add(clave);

                    famosos.push({
                        nombre,
                        fecha,
                        edad,
                        cumple
                    });

                    continue;
                }
                
                if(
                    lineaMin.includes("nombre del lugar") ||
                    lineaMin.includes("dirección completa") ||
                    lineaMin.includes("direccion completa") ||
                    lineaMin.includes("georeferencia")
                ){
                    ignorados++;
                    continue;
                }

                let direccion = linea.replace(/^\d+\.\s*/, "").trim();

                if(registros.has(direccion.toLowerCase())){
                    duplicados++;
                    continue;
                }

                registros.add(direccion.toLowerCase());

                let partes = linea.split(";");

                let nombreLugar = partes[0]?.trim() || "Sin nombre";
                let direccionCompleta = partes[1]?.trim() || "Sin dirección";
                let georeferencia = partes[2]?.trim() || "Sin georeferencia";

                let partesDireccion = direccionCompleta.split(",");

                let calleNumero = partesDireccion[0]?.trim() || "Sin calle";
                let ciudad = partesDireccion[1]?.trim() || "Sin ciudad";
                let pais = partesDireccion[2]?.trim() || "Chile";

                let matchNumero = calleNumero.match(/\d+/);

                let numeroCalle = matchNumero
                    ? matchNumero[0]
                    : "S/N";

                let nombreCalle = calleNumero
                    .replace(/\d+/g, "")
                    .trim();

                if(nombreCalle === ""){
                    nombreCalle = calleNumero;
                }

                tablaLugares.push({
                    id: contadorID,
                    nombre_lugar: nombreLugar
                });

                tablaGeo.push({
                    id: contadorID,
                    lugar_id: contadorID,
                    georeferencia: georeferencia
                });

                tablaDirecciones.push({
                    id: contadorID,
                    nombre_calle: nombreCalle,
                    numero_calle: numeroCalle,
                    ciudad_estado_provincia: ciudad,
                    pais: pais
                });

                contadorID++;
            }

            agregarLog(`${duplicados} duplicados eliminados`);
            agregarLog(`${ignorados} líneas ignoradas`);

            if(esFamosos){
                famososGlobal = famosos;
                mostrarTablaFamosos(famosos);
                agregarLog(`Tabla Famosos generada con ${famosos.length} registros`);
            }else if(esComunas){
                let consolidadas = comunas.filter(c =>
                    c.estado === "Consolidada"
                ).length;
                
                let noEncontradas = comunas.filter(c =>
                    c.estado !== "Consolidada"
                ).length;

                let auditoriaComunas = {
                    fecha: new Date().toLocaleString(),
                    registrosLeidos: lineas.length,
                    duplicadosEliminados: duplicados,
                    lineasIgnoradas: ignorados,
                    comunasConsolidadas: consolidadas,
                    comunasNoEncontradas: noEncontradas
                };

                console.log(auditoriaComunas);

                mostrarTablaComunas(comunas);
                mostrarAuditoriaComunas(auditoriaComunas);

                 agregarLog(
                    `Tabla Comunas generada con ${comunas.length} registros`
                );

            }else{
                mostrarTablasLugares(
                    tablaLugares,
                    tablaGeo,
                    tablaDirecciones
                );

                mostrarMapaLugares(
                    tablaLugares,
                    tablaGeo
                );

                agregarLog("3 tablas generadas correctamente");
            }

            agregarLog("Proceso completado");

        }catch(error){
            agregarLog("ERROR: " + error.message);
            console.error(error);
        }
    };

    lector.onerror = function(){
        agregarLog("ERROR: No se pudo leer el archivo");
    };

    agregarLog("Procesando archivo...");
    lector.readAsText(archivo, "utf-8");
}

    <details open>

        <summary class="desplegable">
            Tabla Comunas (${comunas.length})
        </summary>

        <table>

            <thead>
                <tr>
                    <th>ID</th>
                    <th>Comuna</th>
                    <th>Región</th>
                    <th>Habitantes</th>
                    <th>Estado</th>
                </tr>
            </thead>

            <tbody>
    `;

    comunas.forEach((comuna, index) => {
        html += `
        <tr>
            <td>${index + 1}</td>
            <td>${comuna.nombre}</td>
            <td>${comuna.region}</td>
            <td>${comuna.habitantes}</td>
            <td>${comuna.estado}</td>
        </tr>
        `;
    });

    html += `
            </tbody>

        </table>

    </details>
    `;

    document.getElementById("resultado")
        .innerHTML = html;
}

    `;

async function verImagenFamoso(id){

    const famoso = famososGlobal.find(f => f.id === id);

    if(!famoso){
        alert("No se encontró el famoso");
        return;
    }

    const resultado = await obtenerImagenWikipedia(famoso.nombre);

    if(!resultado){
        alert("No se encontró imagen para " + famoso.nombre);
        return;
    }

    document.getElementById("resultadoImagen").innerHTML = `
        <div style="margin-top:20px; text-align:center;">
            <h3>${famoso.nombre}</h3>
            <p><b>Fecha nacimiento:</b> ${famoso.fecha}</p>
            <p><b>Edad:</b> ${famoso.edad}</p>
            <p><b>Cumpleaños:</b> ${famoso.cumple}</p>

            <img src="${resultado.imagen}" style="max-width:250px; border-radius:12px;">

            <p>
                Fuente:
                <a href="${resultado.fuente}" target="_blank">
                    Wikipedia
                </a>
            </p>
        </div>
    `;
}

async function obtenerImagenWikipedia(nombre){

    const url =
        "https://en.wikipedia.org/api/rest_v1/page/summary/" +
        encodeURIComponent(nombre);

    const respuesta = await fetch(url);

    if(!respuesta.ok){
        return null;
    }

    const datos = await respuesta.json();

    if(!datos.thumbnail){
        return null;
    }

    return {
        imagen: datos.thumbnail.source,
        fuente: datos.content_urls.desktop.page
    };
}

            </tbody>

    </details>
    `;

    html += `
    <details>

        <summary class="desplegable">
            Tabla Direcciones (${direcciones.length})
        </summary>

        <table>

            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre Calle</th>
                    <th>Número Calle</th>
                    <th>Ciudad / Estado / Provincia</th>
                    <th>País</th>
                </tr>
            </thead>

            <tbody>
    `;

    direcciones.forEach(d => {

        html += `
        <tr>
            <td>${d.id}</td>
            <td>${d.nombre_calle}</td>
            <td>${d.numero_calle}</td>
            <td>${d.ciudad_estado_provincia}</td>
            <td>${d.pais}</td>
        </tr>
        `;
    });

    html += `
            </tbody>

        </table>

    </details>
    `;

    document.getElementById("resultado").innerHTML =
        html +
        `<div id="mapaLugares"></div>`;
}

let mapa = null;

function mostrarMapaLugares(lugares, geo){

    if(mapa !== null){
        mapa.remove();
    }

    mapa = L.map("mapaLugares").setView([0, 0], 2);

    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        attribution: "© OpenStreetMap"
    }).addTo(mapa);

    let puntos = [];

    geo.forEach(g => {

        let partes = g.georeferencia.split(",");

        let lat = parseFloat(partes[0]);
        let lng = parseFloat(partes[1]);

        if(isNaN(lat) || isNaN(lng)){
            return;
        }

        let lugar = lugares.find(l => l.id === g.id);

        L.marker([lat, lng])
            .addTo(mapa)
            .bindPopup(`
                <b>${lugar ? lugar.nombre_lugar : "Lugar"}</b><br>
                Latitud: ${lat}<br>
                Longitud: ${lng}
            `);

        puntos.push([lat, lng]);
    });

    if(puntos.length > 0){
        mapa.fitBounds(puntos);
    }
}
